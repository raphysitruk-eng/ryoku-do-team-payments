name: Validate Ryoku-Do Team Payments

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate portal files
        shell: bash
        run: |
          set -euo pipefail
          test -s admin.html
          test -s parent.html
          test -s terms.html
          test -s thank-you.html
          test -s theme.css
          test -s admin.js
          test -s parent.js
          test -s recover.js
          test -s supabase/functions/team-payment-api-v2/index.ts
          test -s supabase/functions/team-payment-provider-hook/index.ts
          test -s supabase/functions/team-payment-invoice4u-ipn/index.ts
          test -s supabase/migrations/20261005183456_team_payment_operational_hardening.sql
          test -s supabase/migrations/20261005183549_team_payment_monitoring_and_retention.sql
          test -s supabase/migrations/20261005183855_team_payment_october_production_baseline.sql
          grep -q 'team-payment-api-v2' admin.js
          grep -q 'team-payment-api-v2' parent.js
          grep -q 'כתובת IPN בסיסית' admin.html
          grep -q 'termsSummary' parent.html
          test -s OPERATIONS.md
          test -s portal.html
          test -s portal.js
          grep -q 'currentLevel==="aal2"' admin.js
          grep -q 'claims?.aal!=="aal2"' supabase/functions/team-payment-api-v2/index.ts
          grep -q 'claims?.aal!=="aal2"' supabase/functions/team-payment-provider-hook/index.ts
          grep -q 'portal_account_exists' parent.js
          grep -q 'admin_student_detail' supabase/functions/team-payment-api-v2/index.ts
          grep -q 'accounts.ryokudoacademy.com' supabase/functions/team-payment-api-v2/index.ts
          grep -q 'accounts.ryokudoacademy.com' portal.js
          grep -q 'team_payment_run_maintenance' supabase/migrations/20261005183549_team_payment_monitoring_and_retention.sql
          grep -q 'Leaked Password Protection' OPERATIONS.md
          grep -q 'branch protection/ruleset' OPERATIONS.md
          ! grep -R -E 'sb_secret_|service_role[=:][^A-Za-z_]|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"']+' --include='*.html' --include='*.js' --include='*.css' --include='*.ts' --include='*.sql' . || exit 1

      - name: Check JavaScript syntax and CSP hardening
        shell: bash
        run: |
          node --check admin.js
          node --check parent.js
          node --check recover.js
          ! grep -q "script-src 'self' 'unsafe-inline'" admin.html
          ! grep -q "script-src 'self' 'unsafe-inline'" parent.html
          ! grep -q "script-src 'self' 'unsafe-inline'" recover.html
          grep -q 'src="admin.js' admin.html
          grep -q 'src="parent.js' parent.html
          grep -q 'src="recover.js' recover.html
          echo 'JavaScript syntax and CSP checks OK'

