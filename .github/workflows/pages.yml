name: Deploy Ryoku-Do Team Payments to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require merged PR for production
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs="$(curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
          merged_count="$(printf '%s' "$prs" | jq '[.[] | select(.merged_at != null)] | length')"
          if [ "$merged_count" -lt 1 ]; then
            echo "::error::Production deploy blocked: commit is not associated with a merged pull request."
            exit 1
          fi

      - name: Validate portal files
        shell: bash
        run: |
          set -euo pipefail
          test -s admin.html
          test -s parent.html
          test -s terms.html
          test -s thank-you.html
          test -s theme.css
          grep -q 'team-payment-api-v2' admin.html
          grep -q 'team-payment-api-v2' parent.html
          grep -q 'כתובת IPN בסיסית' admin.html
          grep -q 'termsSummary' parent.html
          ! grep -R -E 'service[_-]?role|SUPABASE_SECRET|sb_secret_' --include='*.html' --include='*.js' --include='*.css' . || exit 1

      - name: Check inline JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['admin.html','parent.html','thank-you.html','terms.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const re = /<script(?:[^>]*)>([\s\S]*?)<\/script>/gi;
            let m;
            while ((m = re.exec(html))) {
              const js = m[1].trim();
              if (js) new Function(js);
            }
          }
          console.log('Inline JavaScript syntax OK');
          NODE

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
