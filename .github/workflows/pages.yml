name: Deploy Ryoku-Do Team Payments to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require merged PR for production
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs="$(curl -fsSL             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls")"
          merged_count="$(printf '%s' "$prs" | jq '[.[] | select(.merged_at != null)] | length')"
          if [ "$merged_count" -lt 1 ]; then
            echo "::error::Production deploy blocked: commit is not associated with a merged pull request."
            exit 1
          fi

      - name: Validate portal files
        shell: bash
        run: |
          set -euo pipefail
          test -s admin.html
          test -s parent.html
          test -s terms.html
          test -s thank-you.html
          test -s theme.css
          test -s admin.js
          test -s parent.js
          test -s recover.js
          grep -q 'team-payment-api-v2' admin.js
          grep -q 'team-payment-api-v2' parent.js
          grep -q 'כתובת IPN בסיסית' admin.html
          grep -q 'termsSummary' parent.html
          ! grep -R -E 'sb_secret_|service_role[=:][^A-Za-z_]|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"']+' --include='*.html' --include='*.js' --include='*.css' --include='*.ts' --include='*.sql' . || exit 1

      - name: Check JavaScript syntax and CSP hardening
        shell: bash
        run: |
          node --check admin.js
          node --check parent.js
          node --check recover.js
          ! grep -q "script-src 'self' 'unsafe-inline'" admin.html
          ! grep -q "script-src 'self' 'unsafe-inline'" parent.html
          ! grep -q "script-src 'self' 'unsafe-inline'" recover.html
          grep -q 'src="admin.js' admin.html
          grep -q 'src="parent.js' parent.html
          grep -q 'src="recover.js' recover.html
          echo 'JavaScript syntax and CSP checks OK'

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
