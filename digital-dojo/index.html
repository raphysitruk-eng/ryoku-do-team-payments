<style>
:root{--bg:#f5f7fa;--ink:#17283f;--muted:#68778a;--line:#e2e8f0;--navy:#13253b;--accent:#c99c4e;--teal:#0b706d;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif;font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}a{color:var(--teal)}.hero{background:linear-gradient(115deg,#122237,#1b3854);color:white;padding:24px clamp(18px,4vw,50px)}.hero-in{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.05em;font-size:22px}.brand small{display:block;font-weight:400;letter-spacing:normal;font-size:13px;color:#b5c4d3}.gold{color:#e6ba66}
.container{max-width:1240px;margin:28px auto;padding:0 18px}.panel{background:var(--white);border:1px solid var(--line);border-radius:17px;box-shadow:0 8px 24px rgba(19,37,59,.035);padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0 22px;padding:4px 0}.tab{background:#fff;border:1px solid var(--line);color:#37475b;padding:10px 19px;border-radius:11px;white-space:nowrap}.tab.active{background:var(--navy);color:white;border-color:var(--navy)}
.btn{border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:10px 15px;font-weight:600}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}.btn.danger{color:#a32835;border-color:#e9bec3}.btn.small{padding:6px 9px;font-size:12px}.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a8d8dc;outline-offset:1px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.sm{font-size:13px}.note{background:#fff9ed;border-right:4px solid #c99c4e;padding:13px 16px;border-radius:8px;margin:12px 0}.danger-note{background:#fff3f3;border-color:#d6606a}.section-title{font-size:21px;font-weight:800;margin:0 0 8px}.video{padding:0;overflow:hidden}.thumb{background:linear-gradient(135deg,#2f516f,#0d2134);height:140px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:52px;position:relative}.video .body{padding:15px}.pill{display:inline-block;font-size:12px;font-weight:650;border-radius:100px;padding:3px 9px;background:#e8f0f6;color:#405972}.pill.green{background:#d8f1e8;color:#086d55}.pill.gold{background:#fff1d8;color:#8e5915}.pill.red{background:#ffe5e7;color:#ae3946}
.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-weight:650}.field input,.field select,.field textarea{border:1px solid #cdd7e2;border-radius:9px;padding:10px;width:100%;background:#fff;color:#17283f}.check{display:inline-flex;align-items:center;gap:6px;margin:7px 12px 7px 0}.check input{width:auto}
.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.list-item{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:10px 0}.list-item:last-child{border-bottom:0}.login{max-width:450px;margin:42px auto}.foot{text-align:center;color:#8d98a5;font-size:12px;padding:35px 18px}.overlay{position:fixed;inset:0;background:#000b;display:none;z-index:10;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.player{background:#13253b;width:min(100%,960px);padding:14px;border-radius:16px;color:white}.player iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:9px;background:#101820}.error{color:#9f2c39}.good{color:#147b60}.stack>*+*{margin-top:12px}.empty{text-align:center;padding:48px;color:#66768c}.count{font-size:29px;font-weight:800}
@media(max-width:620px){.hero{padding:19px}.container{margin:18px auto}.panel{padding:15px}.section-title{font-size:19px}}
</style></head><body>
<header class="hero"><div class="hero-in"><div class="brand">RYOKU-DO <span class="gold">DIGITAL DOJO</span><small>ספריית ההדרכה של האקדמיה לקראטה שוטוקאן</small></div><div class="row"><a href="https://www.ryokudoacademy.com/" style="color:#e8f1f9">לאתר האקדמיה</a><span id="userbadge" class="sm"></span><button class="btn small" id="logoutBtn" style="display:none">התנתקות</button></div></div></header>
